<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event Viewer</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: #181825;
            border-bottom: 1px solid #313244;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            flex: 1;
        }

        #status-badge {
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 999px;
            font-weight: 600;
            background: #45475a;
            color: #cdd6f4;
            transition: background 0.3s, color 0.3s;
        }

        #status-badge.connected {
            background: #a6e3a1;
            color: #1e1e2e;
        }

        #status-badge.error {
            background: #f38ba8;
            color: #1e1e2e;
        }

        button {
            padding: 6px 18px;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:disabled { opacity: 0.4; cursor: default; }

        #btn-start {
            background: #a6e3a1;
            color: #1e1e2e;
        }

        #btn-stop {
            background: #f38ba8;
            color: #1e1e2e;
        }

        #btn-clear {
            background: #45475a;
            color: #cdd6f4;
        }

        #event-log {
            flex: 1;
            overflow-y: auto;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .event-entry {
            display: grid;
            grid-template-columns: 170px 1fr;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            background: #181825;
            border-left: 3px solid #89b4fa;
            font-size: 0.82rem;
            line-height: 1.4;
            animation: fadeIn 0.2s ease;
        }

        .event-entry.system {
            border-left-color: #a6e3a1;
            color: #a6e3a1;
        }

        .event-entry.error {
            border-left-color: #f38ba8;
            color: #f38ba8;
        }

        .event-time {
            color: #6c7086;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .event-message {
            word-break: break-word;
        }

        #empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #45475a;
            font-size: 0.9rem;
            pointer-events: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <header>
        <h1>&#128268; Event Viewer</h1>
        <span id="status-badge">Idle</span>
        <button id="btn-start">&#9654; Start</button>
        <button id="btn-stop" disabled>&#9632; Stop</button>
        <button id="btn-clear">&#128465; Clear</button>
    </header>

    <div id="event-log">
        <div id="empty-state">Press <strong>&nbsp;Start&nbsp;</strong> to begin monitoring events.</div>
    </div>

    <script>
        const btnStart  = document.getElementById('btn-start');
        const btnStop   = document.getElementById('btn-stop');
        const btnClear  = document.getElementById('btn-clear');
        const log       = document.getElementById('event-log');
        const badge     = document.getElementById('status-badge');
        const emptyState = document.getElementById('empty-state');

        let eventSource = null;

        function formatTime(isoString) {
            try {
                const d = new Date(isoString);
                return d.toLocaleTimeString(undefined, { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })
                    + '.' + String(d.getMilliseconds()).padStart(3, '0');
            } catch {
                return isoString;
            }
        }

        function addEntry(timeStr, message, kind) {
            emptyState.style.display = 'none';
            const row = document.createElement('div');
            row.className = 'event-entry' + (kind ? ` ${kind}` : '');

            const tCell = document.createElement('span');
            tCell.className = 'event-time';
            tCell.textContent = timeStr;

            const mCell = document.createElement('span');
            mCell.className = 'event-message';
            mCell.textContent = message;

            row.appendChild(tCell);
            row.appendChild(mCell);
            log.appendChild(row);
            row.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        function setStatus(text, cls) {
            badge.textContent = text;
            badge.className   = cls ? `connected ${cls}`.trim() : '';
            if (cls === 'connected') badge.className = 'connected';
            if (cls === 'error')     badge.className = 'error';
        }

        function startMonitoring() {
            if (eventSource) return;

            setStatus('Connecting…', '');
            btnStart.disabled = true;
            btnStop.disabled  = false;

            eventSource = new EventSource('/TestAPI/MonitorEvents');

            eventSource.onopen = () => {
                setStatus('Connected', 'connected');
            };

            eventSource.onmessage = (e) => {
                try {
                    const payload = JSON.parse(e.data);
                    if (payload.type === 'connected') {
                        addEntry(new Date().toLocaleTimeString(undefined, { hour12: false }), payload.message, 'system');
                    } else {
                        addEntry(formatTime(payload.timestamp), payload.message, '');
                    }
                } catch {
                    addEntry(new Date().toLocaleTimeString(), e.data, '');
                }
            };

            eventSource.onerror = () => {
                setStatus('Error / Disconnected', 'error');
                cleanup();
            };
        }

        function cleanup() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            btnStart.disabled = false;
            btnStop.disabled  = true;
        }

        function stopMonitoring() {
            cleanup();
            setStatus('Idle', '');
            addEntry(new Date().toLocaleTimeString(undefined, { hour12: false }), 'Monitoring stopped.', 'system');
        }

        btnStart.addEventListener('click', startMonitoring);
        btnStop.addEventListener('click',  stopMonitoring);
        btnClear.addEventListener('click', () => {
            log.innerHTML = '';
            log.appendChild(emptyState);
            emptyState.style.display = '';
        });
    </script>
</body>
</html>
